title: トクミル
description: 商品と値札を撮るだけで、店頭とネットの最安値を簡単比較。節約の成果を記録できる節約アプリ
lang: ja
url: https://ringedseal1234-ctrl.github.io
baseurl: /tokumiru-legal
repository: ringedseal1234-ctrl/tokumiru-legal

# アプリ配信状況（/dl.html のリンク・振り分けに使う）。
# app_store_id: App Store Connect でアプリレコードを作ると採番される数値ID。
#   未確定のうちは空のままにする（空なら iOS へのリンク・自動遷移を出さない）。
# play_live:    Google Play で公開したら true にする。
#   false のうちは Play へのリンク・自動遷移を出さない（未公開URLは404になるため）。
# アプリ側のシェア文はこのページを指すので、ここを更新するだけで
# 配布済みアプリからの導線もすべて正しいストアへ届く（再ビルド・再申請は不要）。
app_store_id: ""
play_package: jp.tokumiru.app
play_live: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/images/og-image.svg
  - scope:
      path: ""
      type: pages
    values:
      lang: ja

exclude:
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - docs/
  - scripts/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - build/
  - "*.dart"
  - "*.ts"
  - "*.kt"
  - "*.java"
  - "*.swift"
  - "*.gradle"
  - lib/
  - functions/
  - android/
  - ios/
  - src/

strict_front_matter: true
