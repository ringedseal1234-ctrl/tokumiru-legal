---
layout: default
---
<header class="page-hero page-hero--polished">
  <div class="content-shell content-shell--narrow">
    <span class="page-hero__motif" aria-hidden="true"><i></i><i></i><i></i></span>
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="page-hero__lead">{{ page.lead }}</p>{% endif %}
  </div>
</header>
<div class="page-content content-shell content-shell--narrow page-content--polished">
  {{ content }}
</div>
